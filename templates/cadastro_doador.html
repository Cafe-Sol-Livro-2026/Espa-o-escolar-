{% extends "base.html" %}

{% block conteudo %}
<section class="cadastro">
    <h1>Vamos realizar seu cadastro!</h1>
    <p class="subtitulo">Precisaremos de algumas informações.</p>

    <form method="post" class="formulario">
        <label for="nome">Nome:</label>
        <input id="nome" name="nome" type="text" required>

        <label for="email">E-mail:</label>
        <input id="email" name="email" type="email" required>

        <label for="senha">Senha:</label>
        <input id="senha" name="senha" type="password" required>

        <label for="cpf">CPF:</label>
        <input id="cpf" name="cpf" type="text" maxlength="11"
               placeholder="Somente números" required>

        <label for="celular">Celular:</label>
        <input id="celular" name="celular" type="tel" required>

        <button class="botao enviar" type="submit">Efetuar cadastro</button>
    </form>

    <a class="voltar" href="{{ url_for('inicio') }}">Voltar</a>
</section>
{% endblock %}
